<link rel="stylesheet" href="/reveal.js-plugins/chalkboard/style.css">
<script src="/reveal.js-plugins/chalkboard/plugin.js"></script>
<script>
    Reveal.configure({
        keyboard: {
            66: function() { RevealChalkboard.toggleChalkboard() },
            67: function () { RevealChalkboard.toggleNotesCanvas() },
        },
        chalkboard: {
            toggleChalkboardButton: true,
            toggleNotesButton: true,
            boardmarkerWidth: 3,
            chalkWidth: 10,
            chalkEffect: 0.1,
            readOnly: false,
            transition: 800,
            theme: "chalkboard", // Can be set to either "chalkboard" or "whiteboard".
            background: ['rgba(141,191,68,.1)', '/reveal.js-plugins/chalkboard/img/blackboard.png'], // The first value expects a (semi-)transparent color which is used to provide visual feedback that the notes canvas is enabled, the second value expects a filename to a background image for the chalkboard.
            eraser: { src: '/reveal.js-plugins/chalkboard/img/sponge.png', radius: 20 },
            grid: false, // This pattern can be modified by setting the color, the distance between lines, and the line width, e.g. { color: 'rgb(127,127,255,0.1)', distance: 40, width: 2}
        }
    })
    Reveal.registerPlugin(RevealChalkboard)
</script>

<text x="453" y="739" font-family="sans-serif" font-size="18" fill="#172033">восьмибайтовая константа 1</text>
<rect x="1" y="753" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="156" y="753" width="285" height="42" fill="#ffffff" stroke="#64748b"/>

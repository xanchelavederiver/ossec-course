<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1006" viewBox="0 0 860 1006" role="img">
<title>Рис. 5. Адресное пространство после переполнения. Адрес возврата из функции my_func перезаписан адресом первого гаджета – 0x4005b3. После завершения функции управление будет передано на цепочку команд, выполнение которых изменит содержимое регистров rdi и rdx, после чего управление будет передано по адресу 0x400699 – на второй гаджет, выполнение которого изменит значения регистров rsi и r15. В результате в регистрах будут храниться следующие значения: rdi==0x1, rsi==0x3, rdx==0x2</title>
<rect x="1" y="1" width="155" height="42" fill="#e8edf2" stroke="#64748b"/>
<rect x="156" y="1" width="285" height="42" fill="#e8edf2" stroke="#64748b"/>
<text x="168" y="29" font-family="sans-serif" font-size="18" fill="#172033" font-weight="bold">Адресное пространство</text>
<rect x="441" y="1" width="418" height="42" fill="#e8edf2" stroke="#64748b"/>
<text x="453" y="29" font-family="sans-serif" font-size="18" fill="#172033" font-weight="bold">Комментарии</text>
<rect x="1" y="43" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="156" y="43" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="441" y="43" width="418" height="42" fill="#ffffff" stroke="#64748b"/>

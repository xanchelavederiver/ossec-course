<rect x="441" y="753" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="795" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="156" y="795" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="823" font-family="sans-serif" font-size="18" fill="#172033">0x400699</text>
<rect x="441" y="795" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="453" y="823" font-family="sans-serif" font-size="18" fill="#172033">адрес гаджета #2</text>

<rect x="156" y="85" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="113" font-family="sans-serif" font-size="18" fill="#172033">...</text>
<rect x="441" y="85" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="127" width="155" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="13" y="155" font-family="monospace" font-size="18" fill="#172033">0x4005b3:</text>
<rect x="156" y="127" width="285" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="155" font-family="sans-serif" font-size="18" fill="#172033">pop rdi</text>
<text x="168" y="179" font-family="sans-serif" font-size="18" fill="#172033">pop rdx</text>
<text x="168" y="203" font-family="sans-serif" font-size="18" fill="#172033">ret</text>
<rect x="441" y="127" width="418" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="453" y="155" font-family="sans-serif" font-size="18" fill="#172033">гаджет #1</text>
<rect x="1" y="215" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="156" y="215" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="243" font-family="sans-serif" font-size="18" fill="#172033">...</text>
<rect x="441" y="215" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="257" width="155" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="13" y="285" font-family="monospace" font-size="18" fill="#172033">0x400699:</text>
<rect x="156" y="257" width="285" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="285" font-family="sans-serif" font-size="18" fill="#172033">pop rsi</text>
<text x="168" y="309" font-family="sans-serif" font-size="18" fill="#172033">pop r15</text>
<text x="168" y="333" font-family="sans-serif" font-size="18" fill="#172033">ret</text>
<rect x="441" y="257" width="418" height="88" fill="#ffffff" stroke="#64748b"/>
<text x="453" y="285" font-family="sans-serif" font-size="18" fill="#172033">гаджет #2</text>

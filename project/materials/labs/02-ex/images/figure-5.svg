<rect x="156" y="345" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="373" font-family="sans-serif" font-size="18" fill="#172033">...</text>
<rect x="441" y="345" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="387" width="155" height="112" fill="#ffffff" stroke="#64748b"/>
<text x="13" y="415" font-family="monospace" font-size="18" fill="#172033">my_func:</text>
<rect x="156" y="387" width="285" height="112" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="415" font-family="sans-serif" font-size="18" fill="#172033">push rbp</text>
<text x="168" y="439" font-family="sans-serif" font-size="18" fill="#172033">mov rsp, rbp</text>
<text x="168" y="463" font-family="sans-serif" font-size="18" fill="#172033">sub rsp, 0x40</text>
<text x="168" y="487" font-family="sans-serif" font-size="18" fill="#172033">...</text>
<rect x="441" y="387" width="418" height="112" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="499" width="155" height="64" fill="#ffffff" stroke="#64748b"/>
<text x="13" y="527" font-family="monospace" font-size="18" fill="#172033">rip =&gt;</text>
<rect x="156" y="499" width="285" height="64" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="527" font-family="sans-serif" font-size="18" fill="#172033">pop rbp</text>
<text x="168" y="551" font-family="sans-serif" font-size="18" fill="#172033">ret</text>
<rect x="441" y="499" width="418" height="64" fill="#ffffff" stroke="#64748b"/>
<text x="453" y="527" font-family="sans-serif" font-size="18" fill="#172033">выполняющаяся функция</text>
<rect x="1" y="563" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="156" y="563" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="441" y="563" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<rect x="1" y="605" width="155" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="13" y="633" font-family="monospace" font-size="18" fill="#172033">rsp =&gt;</text>
<rect x="156" y="605" width="285" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="168" y="633" font-family="sans-serif" font-size="18" fill="#172033">&quot;AAAAAAAA&quot;</text>
<rect x="441" y="605" width="418" height="42" fill="#ffffff" stroke="#64748b"/>
<text x="453" y="633" font-family="sans-serif" font-size="18" fill="#172033">текущая вершина стека</text>
